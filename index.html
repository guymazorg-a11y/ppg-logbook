<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>יומן מנוע</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">⚙</span>
    <div>
      <div class="brand-title" id="engineName">יומן מנוע</div>
      <div class="brand-sub" id="backupStatus"></div>
    </div>
  </div>
  <button class="icon-btn" id="quickBackup" title="גיבוי לאקסל" aria-label="גיבוי לאקסל">⤓ אקסל</button>
</header>

<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="dash" class="active"><span class="ti">◉</span><span>בקרה</span></button>
  <button data-tab="flights"><span class="ti">☰</span><span>טיסות</span></button>
  <button data-tab="add" class="add"><span class="ti">＋</span><span>טיסה</span></button>
  <button data-tab="maint"><span class="ti">🔧</span><span>תחזוקה</span></button>
  <button data-tab="settings"><span class="ti">⚙</span><span>גיבוי</span></button>
</nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card" id="modalCard"></div>
</div>
<div id="toast" class="toast hidden"></div>

<input type="file" id="fileTrack" accept=".igc,.gpx,.IGC,.GPX,application/gpx+xml,application/octet-stream,text/plain" hidden multiple>
<input type="file" id="fileExcel" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script src="vendor/exceljs.min.js"></script>
<script src="drive.js"></script>
<script src="app.js"></script>
<script src="import.js"></script>
</body>
</html>
